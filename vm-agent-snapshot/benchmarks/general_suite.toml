goal = "Open the local benchmark form page, fill name, email, and notes fields, submit it, and verify the success confirmation."

[[tasks]]
id = "web-search-navigation"
app = "Firefox"
category = "web"
goal = "Search the web for the configured query, open the first result, and verify the page title contains the expected keyword."

[[tasks]]
id = "web-multitab-copy"
app = "Firefox"
category = "web"
goal = "Open two tabs, copy the headline from the first tab, paste it into the second tab form, and verify the pasted text."

[[tasks]]
id = "web-login-wall-detection"
app = "Firefox"
category = "web"
goal = "Navigate to the configured protected page and report an auth wall if credentials are required."

[[tasks]]
id = "files-create-rename"
app = "Files"
